<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>1to50</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14323d">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="best">BEST <span id="best-value">--.--</span></div>
    <div id="timer">0.00</div>
    <div id="hud-btns">
      <button id="btn-rank" title="世界排行榜">🏆</button>
      <button id="btn-settings" title="设置">⚙️</button>
      <button id="btn-restart" title="重新开始">↻</button>
    </div>
  </header>

  <main id="board"></main>

  <footer id="queue-wrap">
    <div id="queue-current"></div>
    <div id="queue-next"></div>
  </footer>

  <div id="overlay">
    <div id="countdown"></div>
    <div id="gameover">
      <div id="go-text">FINISH!</div>
      <div id="go-time"></div>
      <div id="go-stars"></div>
      <div id="go-record"></div>
      <div id="go-rank"></div>
      <div id="go-name-row">
        <input id="go-name-input" maxlength="16" placeholder="上榜昵称">
        <button id="btn-submit-name">上榜</button>
      </div>
      <div id="go-btns">
        <button id="btn-again">再来一局</button>
        <button id="btn-menu">回菜单</button>
      </div>
    </div>
  </div>

  <div id="menu">
    <div id="menu-title">1<span>to</span>50</div>
    <div id="menu-best-label">本地最佳 <b id="menu-best">--.--</b> s</div>
    <button id="btn-menu-start">开 始</button>
    <div id="menu-row">
      <button id="btn-menu-rank">🏆 排行榜</button>
      <button id="btn-menu-settings">⚙️ 设置</button>
    </div>
  </div>

  <div id="settings-modal">
    <div id="settings-panel">
      <div id="settings-title">⚙️ 设置</div>
      <div class="set-row">
        <span>音效</span>
        <div class="toggle" id="toggle-sound"></div>
      </div>
      <div class="set-row">
        <span>震动</span>
        <div class="toggle" id="toggle-vibration"></div>
      </div>
      <button id="btn-settings-close">关闭</button>
    </div>
  </div>

  <div id="rank-modal">
    <div id="rank-panel">
      <div id="rank-title">🏆 世界排行榜</div>
      <ol id="rank-list"></ol>
      <button id="btn-rank-close">关闭</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("/service-worker.js");
</script>
</body>
</html>
