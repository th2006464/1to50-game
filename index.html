<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>1to50</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="best">BEST <span id="best-value">--.--</span></div>
    <div id="timer">0.00</div>
    <button id="btn-restart" title="重新开始">↻</button>
  </header>

  <main id="board"></main>

  <footer id="queue-wrap">
    <div id="queue-current"></div>
    <div id="queue-next"></div>
  </footer>

  <div id="overlay">
    <div id="countdown"></div>
    <div id="gameover">
      <div id="go-text">GAME OVER</div>
      <div id="go-time"></div>
      <div id="go-stars"></div>
      <div id="go-record"></div>
      <button id="btn-again">再来一局</button>
    </div>
  </div>
</div>
<audio id="snd"></audio>
<script src="game.js"></script>
</body>
</html>
